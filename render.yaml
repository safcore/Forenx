services:
  - type: web
    name: forenx-backend
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://forenx-azure.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://forenx-azure.vercel.app,https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: forenx-db
          property: connectionString
      - key: FRONTEND_URL
        value: "https://forenx-azure.vercel.app"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_TIMEOUT
        value: "8"
      - key: FORENX_STORAGE_BACKEND
        value: "supabase"

databases:
  - name: forenx-db
    databaseName: forenx_db
    user: forenx_user
    plan: free
